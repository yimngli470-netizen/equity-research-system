    Figma (IPO 2025) IR site is Q4 Inc-hosted (same default.aspx platform as
    UBER), so the quarterly artifact list is likely JS-rendered and may need a
    headless fetcher to succeed; FMP is the primary transcript source until then.
    ir_url set per user to /overview/default.aspx (2026-06-12).
