AMD:
  ir_url: https://ir.amd.com/financial-information/quarterly-results
  strategy:
    type: link_regex
    pattern: AMD_{q}Q_{year}_Earnings\.pdf
  artifact_type: transcript
  notes: "AMD posts full earnings call transcripts as PDFs on the CloudFront CDN\n\
    (d1io3yog0oux5.cloudfront.net). The IR quarterly-results page links to them\n\
    directly. URL pattern observed: AMD_{Q}Q_{YEAR}_Earnings.pdf (e.g.\nAMD_1Q_2026_Earnings.pdf).\
    \ Note: AMD uses calendar quarter, not fiscal \u2014\nQ1 2026 = quarter ending\
    \ March 2026.\n"
AAPL:
  ir_url: https://www.apple.com/investor/earnings-call/
  strategy:
    type: link_regex
    pattern: (Q{q}|{q}Q|quarter).*{year}.*(earnings|results|call|transcript)
  artifact_type: press_release
  notes: 'Apple posts quarterly earnings call links and results materials on its IR

    earnings-call page. Official full text transcripts are not consistently

    published there, so the fallback should capture the nearest official

    earnings-call/results artifact and degrade gracefully if it is audio-only.

    '
APPL:
  ir_url: https://www.apple.com/investor/earnings-call/
  strategy:
    type: link_regex
    pattern: (Q{q}|{q}Q|quarter).*{year}.*(earnings|results|call|transcript)
  artifact_type: press_release
  notes: 'Alias for the inactive APPL typo row in the local DB; same IR source as
    AAPL.

    '
AMZN:
  ir_url: https://www.aboutamazon.com/news/company-news
  strategy:
    type: link_regex
    pattern: amazon-earnings-q{q}-{year}-report
  artifact_type: press_release
  notes: "Amazon's IR investor page (ir.aboutamazon.com) renders the quarterly list\n\
    client-side via JS, so httpx sees no transcript links. The corporate news\npage\
    \ (aboutamazon.com/news/company-news) is server-rendered and posts each\nquarter's\
    \ earnings release at a stable URL slug:\n  /news/company-news/amazon-earnings-q{Q}-{YEAR}-report\n\
    Artifact is the press release (net sales, op income, FCF, segment results,\nnext-quarter\
    \ guidance) \u2014 no full call transcript / no Q&A.\n"
AVGO:
  ir_url: https://investors.broadcom.com/financial-information/quarterly-results
  strategy:
    type: url_template
    pattern: https://investors.broadcom.com/news-releases/news-release-details/broadcom-inc-announces-{quarter}-quarter-fiscal-year-{year}-financial
  artifact_type: press_release
  notes: 'Broadcom''s investors.broadcom.com subdomain refuses connections from

    datacenter IPs (TCP RST / read timeout on every request, including the

    landing page and direct news-release URLs). Cannot be scraped without a

    residential-IP proxy or browser automation that can pass the WAF.

    AVGO transcripts must come from FMP. Strategy is retained for future

    use if/when the firewall behavior changes.

    '
BROADCOM:
  ir_url: https://investors.broadcom.com/financial-information/quarterly-results
  strategy:
    type: link_regex
    pattern: (reports|announces).*(Q{q}|{q}Q|{ordinal}-quarter).*{year}.*(financial-results|financial
      results|earnings|results)
  artifact_type: press_release
  notes: 'Alias entry for the inactive BROADCOM row in the local DB; same IR source

    as AVGO.

    '
GOOG:
  ir_url: https://abc.xyz/investor/
  strategy:
    type: link_regex
