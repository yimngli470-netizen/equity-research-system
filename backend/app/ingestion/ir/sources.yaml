    type: link_regex
    pattern: earnings|quarterly|results|investor|financial
  artifact_type: press_release
  notes: 'SpaceX (Space Exploration Technologies Corp.) is a privately held company
    and does not trade under the ticker SPCX on any major public exchange. There is
