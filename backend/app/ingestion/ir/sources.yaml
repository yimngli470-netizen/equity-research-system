INTU:
  ir_url: https://investors.intuit.com/
  strategy:
    type: link_regex
    pattern: (Q{q}\s*FY|Q{q}FY|Q{q}\+FY).*(transcript|earnings(\+|\s)*script)
  artifact_type: transcript
  notes: 'Intuit''s official IR homepage exposes the latest quarterly results card

    with a Transcript link to PDFs named like Q3FY26 Earnings Script.pdf. Match

    the fiscal-quarter token instead of hardcoded dates so new quarters can be

    discovered automatically.

    '
META:
  ir_url: https://investor.atmeta.com/investor-events/default.aspx
  strategy:
    type: link_regex
    pattern: (Q{q}|{q}Q|quarter).*{year}.*(earnings|results|call|transcript)
  artifact_type: transcript
  notes: 'Meta''s investor-events page is the official landing page for quarterly

    earnings calls and transcript/webcast artifacts.

    '
MRVL:
  ir_url: https://investor.marvell.com/financial-information/financial-results
  strategy:
    type: link_regex
    pattern: reports-(Q{q}|{q}Q|{ordinal}-quarter).*(fiscal-year-|and-fiscal-year-){year}.*financial-results
  artifact_type: press_release
  notes: 'Marvell''s financial-results page lists fiscal-quarter earnings artifacts.

    Marvell appears to publish release/slides/audio rather than full text Q&A,

    so this stores the official earnings release as management commentary.

    '
MU:
  ir_url: https://investors.micron.com/quarterly-results
  strategy:
    type: link_regex
    pattern: reports-results-{ordinal}-quarter-fiscal-{year}
  artifact_type: press_release
  notes: "Micron's /quarterly-results page lists one /news-releases/news-release-details/\n\
    link per fiscal quarter. URL slug format:\n  micron-technology-inc-reports-results-{ordinal}-quarter-fiscal-{year}\n\
    where {ordinal} is the spelled-out quarter (first/second/third/fourth) \u2014\n\
    use the {ordinal} placeholder added to discovery._interpolate. MU uses\nfiscal\
    \ year (FY2026 = Sep 2025 to Aug 2026); the orchestrator already\nderives fiscal\
    \ year/quarter via _fiscal_period_from_end_date().\n\nArtifact is the press release\
    \ HTML \u2014 quarterly results commentary +\nforward guidance from management.\
    \ has_qa is False, so the per-ticker KPIs\n(HBM revenue, DRAM/NAND ASP, inventory\
    \ days) come back \"not disclosed\" \u2014\nthey live in the call transcript Q&A\
    \ and the slide deck, NOT the press release.\n\nNETWORK BLOCK (verified 2026-05-29):\
    \ investors.micron.com times out\n(ReadTimeout) from this environment's datacenter\
    \ IP range \u2014 general egress\nworks (SEC/Yahoo/Google reachable), so this\
    \ is MU-specific IP/WAF blocking,\nthe same class as AVGO. The press release we\
    \ have was captured when the site\nwas reachable. The earlier claim that \"Micron\
    \ does not publish prepared\nremarks/slides\" is unverified and likely wrong \u2014\
    \ Micron posts a slide deck +\nCFO commentary under Events & Presentations that\
    \ DO contain HBM rev / bit\ngrowth / ASP / inventory. TODO when reachable (residential\
    \ IP / headless /\nrun from user's machine): retarget artifact_type to slides|prepared_remarks\n\
    and add the deck discovery pattern, then KPIs will fill.\n"
NVDA:
  ir_url: https://investor.nvidia.com/financial-info/quarterly-results/
  strategy:
    type: link_regex
    pattern: (NVDA|NVIDIA).*Q{q}.*{year}.*Earnings.*Call|Q{q}.*{year}.*Earnings.*Call.*(NVDA|NVIDIA)
  artifact_type: transcript
  notes: 'NVIDIA''s investor quarterly-results page links corrected earnings-call

    transcript PDFs. In this environment the page can be Cloudflare-challenged,

    so FMP remains the primary reliable transcript source for NVDA until the

    official IR page can be fetched by the scraper.

    '
TSLA:
  ir_url: https://ir.tesla.com/#quarterly-disclosure
  strategy:
    type: link_regex
    pattern: (Q{q}|{q}Q|quarter).*{year}.*(update|deck|earnings|results|call|transcript)
  artifact_type: slides
  notes: 'Tesla''s official IR quarterly-disclosure page generally posts shareholder

    decks/updates rather than full text call transcripts. The scraper captures

    the official quarterly artifact when no transcript is available.

    NETWORK BLOCK (verified 2026-05-29): ir.tesla.com returns HTTP 403 from this

    environment''s datacenter IP (WAF). Not fetchable here without a residential

    IP / headless browser.

    '
UBER:
  ir_url: https://investor.uber.com/financials/default.aspx
  strategy:
    type: css_selector
    pattern: .module_item.{Q} a.module_link-transcript
  artifact_type: press_release
  notes: "Uber's IR site (Q4 Inc-hosted) renders the quarterly artifact list entirely\n\
    via JavaScript \u2014 the static HTML returned by httpx is a single SPA shell\n\
    with only a \"/financials/default.aspx#quarterly\" anchor and no transcript\n\
    links. Until we add a headless-browser fetcher (e.g. Playwright), this\nentry\
    \ cannot succeed; UBER transcripts must come from FMP.\nURL updated to /financials/default.aspx\
    \ because /financials/quarterly-results/\nnow 404s. The strategy is retained so\
    \ a future headless renderer can use it.\n"
