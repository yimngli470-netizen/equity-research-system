[project]
name = "equity-research-backend"
version = "0.1.0"
description = "AI-Augmented Equity Research System — Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "anthropic>=0.40.0",
    "yfinance>=0.2.40",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "pgvector>=0.3.0",
    "psycopg2-binary>=2.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "python-pptx>=1.0.0",
    "pyyaml>=6.0",
    "playwright>=1.49.0",
    "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers[postgresql]>=4.0.0",
]
# M5 ML track (app/ml/*) — kept optional so the core app/image stay lean. Install with:
#   pip install -e ".[ml]"   (or rebuild the image with it for the offline M5 entrypoints)
ml = [
    "lightgbm>=4.6.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: full backend workflow (ingest → analyze → score) on a test DB with external boundaries mocked",
]
