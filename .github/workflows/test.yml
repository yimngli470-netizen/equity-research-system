name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    # ubuntu-latest has Docker available, which testcontainers uses to spin up an ephemeral
    # pgvector Postgres for the integration/API tests. No services: block needed.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend (with dev/test deps)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  frontend:
    name: frontend (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
