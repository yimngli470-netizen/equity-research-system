services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: equity_research
      POSTGRES_USER: researcher
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local_dev}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researcher -d equity_research"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # This compose file is the DEV (laptop) setup: install the Claude Code CLI so LLM calls can
      # bill your SUBSCRIPTION (APP_ENV=dev → llm_backend=claude_code). Prod uses docker-compose.prod.yml
      # (no CLI; APP_ENV=prod → llm_backend=api). See CLAUDE.md "Dev vs Prod LLM backend".
      args:
        INSTALL_CLAUDE_CLI: "1"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://researcher:${DB_PASSWORD:-changeme_local_dev}@db:5432/equity_research
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=${APP_ENV:-dev}
      # Dev backend: subscription token (run `claude setup-token` on the host → put in .env). The
      # API key is intentionally absent here so dev can never silently bill credits.
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - NEWS_API_KEY=${NEWS_API_KEY:-}
      - FMP_API_KEY=${FMP_API_KEY:-}
      - ENV=${ENV:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_URL=http://localhost:8000

  # NOTE: the `scheduler` service (python -m app.ingestion.scheduler) was REMOVED
  # 2026-06-19. It ran an unattended APScheduler daily cron (Mon-Fri 21:30 UTC)
  # whose daily_job() called run_all_agents → scoring → decision, spending LLM
  # API credits on a timer. This contradicts the project's pull-model decision
  # (ANALYST_ROADMAP, 2026-06-11: "no schedulers/event-driven/alerting"). Do NOT
  # re-add it. Run the pipeline on demand via the frontend "Run Full Pipeline"
  # button or the API. scheduler.py remains in the repo as dormant code.

volumes:
  pgdata:
  redisdata:
